name: CI-compile

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/ps2dev/ps2dev:latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          apk add build-base git

      - name: Compile and test (PS2, protocol, GDB and install)
        run: |
          make clean all check check-gdb check-install hardware-probe-build hardware-probe-variants-build

      - name: Upload sample
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: sample
          path: |
            sample/*.elf
            sample/*.irx

      - name: Create release
        if: github.ref == 'refs/heads/master'
        uses: marvinpinto/action-automatic-releases@latest
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "latest"
          title: "Latest development build"
          files: |
            sample/*.elf
            sample/*.irx

  hardware-experimental-build:
    name: EE experimental hardware GDB build (opt-in)
    runs-on: ubuntu-latest
    container: ghcr.io/ps2dev/ps2dev:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build requirements
        run: apk add build-base git
      - name: Cross-compile experimental debugger and GDB test target
        run: |
          make clean
          make PS2GDB_HW_EXPERIMENTAL=1 all
          mips64r5900el-ps2-elf-nm sample/testgdb.elf | grep -q 'ps2gdb_hw_trampoline'
          mips64r5900el-ps2-elf-nm sample/testgdb.elf | grep -q 'gdb_hw_test_word'
          mips64r5900el-ps2-elf-nm sample/testgdb.elf | grep -q 'gdb_hw_test_function'
          sh tests/check_hw_direct_cache_flush.sh sample/testgdb.elf

  preemptive-context-probe-build:
    name: EE preemptive context observation (compile-only)
    runs-on: ubuntu-latest
    container: ghcr.io/ps2dev/ps2dev:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build requirements
        run: apk add build-base git
      - name: Build VBlank context probe, never execute it in CI
        run: |
          make preemptive-probe-build
          mips64r5900el-ps2-elf-nm tests/preemptive/ee_interrupt_context_probe.elf | grep -q 'ps2gdb_probe_busy_begin'
          mips64r5900el-ps2-elf-nm tests/preemptive/ee_interrupt_context_probe.elf | grep -q 'ps2gdb_probe_busy_end'

  cooperative-ctrlc-build:
    name: EE cooperative Ctrl-C compile-only
    runs-on: ubuntu-latest
    container: ghcr.io/ps2dev/ps2dev:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build requirements
        run: apk add build-base git
      - name: Cross-compile opt-in safe point and manual C client
        run: |
          make clean
          make PS2GDB_CTRL_C_COOPERATIVE=1 all
          mips64r5900el-ps2-elf-nm sample/testgdb.elf | grep -q 'gdbstub_poll_interrupt'
          gcc -std=c99 -Wall -Wextra -Werror tests/ctrlc_rsp_client.c -o /tmp/ctrlc_rsp_client
          make clean
          make PS2GDB_CTRL_C_COOPERATIVE=1 PS2GDB_HW_EXPERIMENTAL=1 all

  native-tests:
    name: Native C tests (${{ matrix.compiler }}, ASan + UBSan)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4

      - name: Test register and TCP/RSP helpers with sanitizers
        env:
          HOST_CC: ${{ matrix.compiler }}
          HOST_CFLAGS: -std=c99 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: make check

  debug-build:
    name: EE debugger build (DEBUG=1)
    runs-on: ubuntu-latest
    container: ghcr.io/ps2dev/ps2dev:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build requirements
        run: apk add build-base git
      - name: Clean EE debug build
        run: make clean debug
